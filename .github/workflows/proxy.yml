name: proxy

on:
  # Currently triggered externally by a Cloudflare Worker (which calls the
  # workflow_dispatch API on a schedule of its own), so no native `schedule`
  # trigger is needed here. Left commented out for later — uncomment these
  # two lines to also have GitHub itself run this every 6 hours.
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      run_update_configs:
        description: 'Run update-configs (fetch/test/publish proxy configs)'
        type: boolean
        default: true
      run_proxy_scan:
        description: 'Run proxy-scan (scan public proxy lists, update stats)'
        type: boolean
        default: true
      run_converter:
        description: 'Run converter (build multi-format configs from external sources)'
        type: boolean
        default: true

permissions:
  contents: write

# Prevents a manual/worker-triggered run from overlapping with another run
# of this same combined workflow. Queues rather than cancels — update-configs
# does real work (tests hundreds of configs) that shouldn't be killed mid-flight.
concurrency:
  group: proxy
  cancel-in-progress: false

# ----------------------------------------------------------------------------
# Toggling jobs on/off (update-configs / proxy-scan / converter)
# ----------------------------------------------------------------------------
# Two switches, and a job only runs when BOTH allow it:
#
# 1. Per-run inputs (workflow_dispatch only — currently every run, since the
#    Cloudflare Worker triggers this via the workflow_dispatch API, and also
#    manual "Run workflow" clicks in the UI): run_update_configs /
#    run_proxy_scan / run_converter, each defaulting to true. If the Worker's
#    API call doesn't set them, the defaults apply. If the `schedule` trigger
#    above gets uncommented later, scheduled runs ignore these (no inputs
#    exist for `schedule` events) and fall through to switch 2 below.
#
# 2. Persistent repo variables (apply no matter what triggered the run):
#    RUN_UPDATE_CONFIGS / RUN_PROXY_SCAN / RUN_CONVERTER
#    (Settings > Secrets and variables > Actions > Variables tab).
#    Set one to the literal string "false" to always skip that job until you
#    change it back. Unset or anything else = enabled. This is the easiest
#    way to permanently turn a job off/on regardless of how it's triggered.
#
# The three jobs are chained with `needs` only to keep them sequential
# (update-configs -> proxy-scan -> converter, converter last as requested).
# Each job's `if` explicitly tolerates its predecessor(s) being skipped
# (but not having failed), so any single job — or any combination — can run
# on its own if the others are toggled off.
jobs:
  update-configs:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.run_update_configs) &&
      vars.RUN_UPDATE_CONFIGS != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository (private collector)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Runs once; git config --global persists in $HOME for the rest of the
      # job, so every later step that commits no longer repeats these two lines.
      - name: Configure git identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Checkout public output repository
        env:
          PUBLIC_REPO_URL: https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/${{ vars.PUBLIC_REPO }}.git
        run: |
          set -e

          mkdir -p public-repo
          cd public-repo
          git init -q
          git remote add origin "$PUBLIC_REPO_URL"

          if git ls-remote --exit-code --heads origin main > /dev/null 2>&1; then
            git fetch -q origin main
            git checkout -q main
          else
            echo "Public repo has no 'main' branch yet (empty repo) — creating it."
            git checkout -q -b main
            mkdir -p configs
            echo "# Proxy configs" > README.md
            echo "Auto-generated by the collector workflow. Do not edit by hand." >> README.md
            git add README.md
            git commit -q -m "Initialize public output repo"
            git push -q -u origin main
          fi

      - name: Verify write access before doing any work
        run: |
          set -e
          echo "Checking push access to private repo..."
          if ! git push --dry-run origin HEAD; then
            echo "::error::No write access to the private repo — check GITHUB_TOKEN/permissions. Aborting before running the pipeline."
            exit 1
          fi

          echo "Checking push access to public repo..."
          if ! git -C public-repo push --dry-run origin HEAD; then
            echo "::error::No write access to '${{ vars.PUBLIC_REPO }}' — check the PUBLIC_REPO_TOKEN secret and that it has write access to that repo. Aborting before running the pipeline."
            exit 1
          fi

          echo "✓ Write access confirmed for both repos, continuing..."

      # GitHub auto-disables a *scheduled* workflow trigger if the repository
      # has had no activity (commits) for 60 days. Right now this workflow is
      # triggered externally (Cloudflare Worker calling workflow_dispatch), so
      # that specific rule doesn't apply — but this step is harmless to leave
      # running, and becomes relevant again the moment the `schedule` trigger
      # above is uncommented. Push an empty commit well before the threshold
      # as a safety net for that case.
      - name: Keep-alive commit (prevent GitHub Actions auto-disable)
        run: |
          last_commit_epoch=$(git log -1 --format=%ct)
          now_epoch=$(date +%s)
          days_since_last_commit=$(( (now_epoch - last_commit_epoch) / 86400 ))
          echo "Days since last commit on private repo: $days_since_last_commit"

          if [ "$days_since_last_commit" -ge 45 ]; then
            echo "Pushing empty keep-alive commit..."
            git commit --allow-empty -m "chore: keep-alive commit"
            git push
          else
            echo "Repo had recent activity ($days_since_last_commit days ago), skipping keep-alive commit."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Xray with retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAX_RETRIES=3
          RETRY_COUNT=0

          install_xray() {
            echo "Attempting to install Xray (Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)..."

            # Authenticated: 5000 req/hr instead of the 60/hr anonymous limit,
            # which this job would otherwise be sharing with every other
            # workflow on the runner's IP -- an anonymous 403 here used to mean
            # falling back to the hardcoded version for no real reason.
            LATEST_URL=$(curl -sL -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/XTLS/Xray-core/releases/latest" | jq -r '.assets[] | select(.name=="Xray-linux-64.zip") | .browser_download_url')

            if [ -z "$LATEST_URL" ] || [ "$LATEST_URL" == "null" ]; then
              echo "Failed to fetch Xray download URL from GitHub API"
              return 1
            fi

            echo "Download URL: $LATEST_URL"

            if ! wget -q --timeout=30 --tries=3 -O xray.zip "$LATEST_URL"; then
              echo "Failed to download Xray"
              return 1
            fi

            if [ ! -f xray.zip ] || [ ! -s xray.zip ]; then
              echo "Downloaded file is missing or empty"
              return 1
            fi

            if ! unzip -o xray.zip xray geoip.dat geosite.dat; then
              echo "Failed to extract Xray"
              rm -f xray.zip
              return 1
            fi

            sudo mv xray /usr/local/bin/
            sudo chmod +x /usr/local/bin/xray

            if ! xray version; then
              echo "Xray installation verification failed"
              return 1
            fi

            rm -f xray.zip geoip.dat geosite.dat LICENSE
            echo "Xray installed successfully"
            return 0
          }

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if install_xray; then
              echo "✓ Xray installation successful"
              exit 0
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Retrying in 30 seconds..."
                sleep 30
              fi
            fi
          done

          echo "✗ Failed to install Xray after $MAX_RETRIES attempts"
          echo "Trying fallback method with hardcoded version..."

          FALLBACK_VERSION="v26.3.27"
          FALLBACK_URL="https://github.com/XTLS/Xray-core/releases/download/${FALLBACK_VERSION}/Xray-linux-64.zip"

          echo "Using fallback URL: $FALLBACK_URL"

          if wget -q --timeout=30 --tries=3 -O xray.zip "$FALLBACK_URL" && \
             unzip -o xray.zip xray geoip.dat geosite.dat && \
             sudo mv xray /usr/local/bin/ && \
             sudo chmod +x /usr/local/bin/xray && \
             xray version; then
            rm -f xray.zip geoip.dat geosite.dat LICENSE
            echo "✓ Xray installed successfully using fallback method"
            exit 0
          else
            echo "✗ Fallback installation also failed"
            exit 1
          fi

      - name: Install sing-box with retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAX_RETRIES=3
          RETRY_COUNT=0

          install_singbox() {
            echo "Attempting to install Sing-box (Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)..."

            LATEST_URL=$(curl -sL -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/SagerNet/sing-box/releases/latest" | jq -r '.assets[] | select(.name | endswith("_linux_amd64.deb")) | .browser_download_url')

            if [ -z "$LATEST_URL" ] || [ "$LATEST_URL" == "null" ]; then
              echo "Failed to fetch Sing-box download URL from GitHub API"
              return 1
            fi

            echo "Download URL: $LATEST_URL"

            if ! wget -q --timeout=30 --tries=3 -O sing-box.deb "$LATEST_URL"; then
              echo "Failed to download Sing-box"
              return 1
            fi

            if [ ! -f sing-box.deb ] || [ ! -s sing-box.deb ]; then
              echo "Downloaded file is missing or empty"
              return 1
            fi

            if ! sudo dpkg -i sing-box.deb; then
              echo "Failed to install Sing-box package"
              sudo apt-get install -f -y
              return 1
            fi

            sudo apt-get install -f -y
            rm -f sing-box.deb
            echo "Sing-box installed successfully"
            return 0
          }

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if install_singbox; then
              echo "✓ Sing-box installation successful"
              exit 0
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Retrying in 30 seconds..."
                sleep 30
              fi
            fi
          done

          echo "✗ Failed to install Sing-box after $MAX_RETRIES attempts"
          echo "Trying fallback method with hardcoded version..."

          FALLBACK_VERSION="1.13.11"
          FALLBACK_URL="https://github.com/SagerNet/sing-box/releases/download/v${FALLBACK_VERSION}/sing-box_${FALLBACK_VERSION}_linux_amd64.deb"

          echo "Using fallback URL: $FALLBACK_URL"

          if wget -q --timeout=30 --tries=3 -O sing-box.deb "$FALLBACK_URL" && \
             sudo dpkg -i sing-box.deb; then
            sudo apt-get install -f -y
            rm -f sing-box.deb
            echo "✓ Sing-box installed successfully using fallback method"
            exit 0
          else
            echo "✗ Fallback installation also failed"
            exit 1
          fi

      - name: Create directories
        run: |
          mkdir -p assets
          mkdir -p configs

      - name: Run config fetcher
        run: python src/fetch_configs.py
        continue-on-error: true

      # Test FIRST (on the raw, unnamed configs) so proxy_configs_tested.txt
      # already holds only the top MAX_OUTPUT_CONFIGS survivors, sorted
      # fastest-first. Location lookup and renaming happen after this on
      # that short list only -- see the two steps below.
      - name: Test configs with Xray
        run: python src/xray_config_tester.py configs/proxy_configs.txt configs/proxy_configs_tested.txt
        continue-on-error: true

      # Runs on proxy_configs_tested.txt (~ MAX_OUTPUT_CONFIGS entries) instead
      # of the full raw fetch (which can be thousands of configs) so this
      # stays well under the free location APIs' rate limits.
      - name: Enrich tested configs with location data
        run: python src/enrich_configs.py configs/proxy_configs_tested.txt configs/location_cache.json
        continue-on-error: true

      # Renames in place, last, so the running counter (۱, ۲, ۳...) is
      # assigned in the final tested/sorted order -- #1 is the fastest
      # surviving config, and the last number matches the total count of
      # published configs.
      - name: Rename tested configs
        run: python src/rename_configs.py configs/location_cache.json configs/proxy_configs_tested.txt configs/proxy_configs_tested.txt
        continue-on-error: true

      - name: Convert configs to sing-box format
        run: python src/config_to_singbox.py

      - name: Backup original sing-box config
        run: |
          if [ -f configs/singbox_configs.json ]; then
            cp configs/singbox_configs.json configs/singbox_configs_all.json
            echo "Original sing-box config backed up to singbox_configs_all.json"
          fi

      - name: Test sing-box configs
        run: python src/config_tester.py configs/singbox_configs_all.json configs/singbox_configs_tested.json
        continue-on-error: true

      - name: Filter insecure configs and generate secure outputs
        run: python src/security_filter.py
        continue-on-error: true

      - name: Generate Clash config
        run: python src/clash_config.py
        continue-on-error: true

      - name: Convert tested configs to Xray format
        run: python src/xray_balancer.py
        continue-on-error: true

      - name: Generate charts and reports
        run: python src/generate_charts.py

      - name: Update README timestamps and stats
        run: |
          timestamp=$(date +%s)

          for file in README.md README_FA.md README_CN.md README_RU.md; do
            if [ -f "$file" ]; then
              sed -i "s/channel_stats_chart\.svg?v=[0-9]*/channel_stats_chart.svg?v=$timestamp/" "$file" || true
              sed -i "s/performance_report\.html?v=[0-9]*/performance_report.html?v=$timestamp/" "$file" || true
            fi
          done

      - name: Sync output files to public repo
        run: |
          mkdir -p public-repo/configs
          # Same folder + filenames as before — only the destination repo changes.
          for f in proxy_configs.txt proxy_configs_tested.txt singbox_configs_all.json \
                   singbox_configs_tested.json singbox_configs_secure.json \
                   xray_loadbalanced_config.json xray_secure_loadbalanced_config.json \
                   clash_config.yaml; do
            if [ -f "configs/$f" ]; then
              cp "configs/$f" "public-repo/configs/$f"
            fi
          done

      - name: Commit and push public repo (configs output)
        working-directory: public-repo
        run: |
          set -e
          if [ ! -d configs ] || [ -z "$(ls -A configs 2>/dev/null)" ]; then
            echo "No configs/ output to commit"
            exit 0
          fi

          # Everything under configs/ here is freshly regenerated output, not
          # hand-edited content, so there is nothing worth a textual 3-way
          # merge. Snapshot it and, on every attempt, reset hard to whatever
          # is currently on origin/main before dropping our copy back on top.
          # This can never hit a merge conflict or leave the checkout in a
          # detached-HEAD/unresolved state the way `git pull --rebase` can
          # (see the proxy-scan job's push step for what that failure looked
          # like in practice).
          mkdir -p /tmp/public-repo-snapshot
          tar -cf /tmp/public-repo-snapshot/configs.tar configs

          max_retries=5
          retry_count=0

          while [ $retry_count -lt $max_retries ]; do
            git fetch origin main
            git reset --hard origin/main
            tar -xf /tmp/public-repo-snapshot/configs.tar
            git add configs/

            if git diff --cached --quiet; then
              echo "No changes to commit (remote already matches)"
              exit 0
            fi

            git commit -m "Update proxy configs"

            if git push; then
              echo "Successfully pushed changes to public repo"
              exit 0
            fi

            retry_count=$((retry_count + 1))
            if [ $retry_count -lt $max_retries ]; then
              echo "Push failed (remote moved), retrying in 30 seconds... (Attempt $retry_count/$max_retries)"
              sleep 30
            fi
          done

          echo "Failed to push to public repo after $max_retries attempts"
          exit 1

      - name: Commit and push private repo (cache, stats page, assets)
        run: |
          set -e
          # location_cache.json stays in the private repo only — it's an internal
          # cache read back in on the next run (enrich_configs.py / rename_configs.py),
          # not a distributed output.
          PATHS_TO_COMMIT=""
          for f in configs/location_cache.json configs/channel_stats.json assets \
                   README.md README_FA.md README_CN.md README_RU.md; do
            [ -e "$f" ] && PATHS_TO_COMMIT="$PATHS_TO_COMMIT $f"
          done

          if [ -z "$PATHS_TO_COMMIT" ]; then
            echo "Nothing to commit"
            exit 0
          fi

          # All of these are regenerated on every run, not hand-edited, so
          # there is nothing worth a textual 3-way merge. Snapshot them and,
          # on every attempt, reset hard to whatever is currently on
          # origin/main before dropping our copies back on top. This can
          # never hit a merge conflict or leave the checkout in a
          # detached-HEAD/unresolved state the way `git pull --rebase` can
          # (see the proxy-scan job's push step for what that failure looked
          # like in practice).
          mkdir -p /tmp/private-repo-snapshot
          tar -cf /tmp/private-repo-snapshot/outputs.tar $PATHS_TO_COMMIT

          max_retries=5
          retry_count=0

          while [ $retry_count -lt $max_retries ]; do
            git fetch origin main
            git reset --hard origin/main
            tar -xf /tmp/private-repo-snapshot/outputs.tar
            git add $PATHS_TO_COMMIT

            if git diff --cached --quiet; then
              echo "No changes to commit (remote already matches)"
              exit 0
            fi

            git commit -m "Update cache, stats and reports"

            if git push; then
              echo "Successfully pushed changes"
              exit 0
            fi

            retry_count=$((retry_count + 1))
            if [ $retry_count -lt $max_retries ]; then
              echo "Push failed (remote moved), retrying in 30 seconds... (Attempt $retry_count/$max_retries)"
              sleep 30
            fi
          done

          echo "Failed to push after $max_retries attempts"
          exit 1

      - name: Send Telegram Notification on Failure (update-configs)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.ADMIN_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            -d "text=❌ <b>خطا در اجرا (update-configs)!</b>%0A%0A📌 <b>ریپازیتوری:</b> ${{ github.repository }}%0A🔗 <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>مشاهده لوگ‌های خطا در گیتهاب</a>"

  proxy-scan:
    needs: update-configs
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.run_proxy_scan) &&
      vars.RUN_PROXY_SCAN != 'false' &&
      (needs.update-configs.result == 'success' || needs.update-configs.result == 'skipped')
    runs-on: ubuntu-latest
    # Hard ceiling so a hung request can never block a future run.
    # The 3-stage test with reduced timeouts should finish in a few
    # minutes; adjust upward if you add a lot more sources.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pysocks

      - name: Run proxy scan
        env:
          PUBLIC_REPO: ${{ vars.PUBLIC_REPO }}
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_BRANCH: main
          HTTP_FILE_PATH: proxies/http.txt
          SOCKS5_FILE_PATH: proxies/socks5.txt
          README_PATH: README.md
        run: python proxy_scan.py

      - name: Commit and push updated stats (private repo only)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f README.md ]; then
            echo "No README.md produced, nothing to commit"
            exit 0
          fi

          # README.md is fully machine-generated (rewritten in full each run),
          # so there is never anything worth a textual 3-way merge. Snapshot
          # our freshly generated copy, then on every attempt reset hard to
          # whatever is currently on origin/main and drop our copy back on
          # top before committing. This can never produce a merge conflict
          # or leave the checkout in a detached-HEAD/unresolved state the
          # way `git pull --rebase` did (see the failure this replaced:
          # a rebase conflict left HEAD detached, so every retry after that
          # just failed with "not currently on a branch").
          mkdir -p /tmp/proxy-scan-snapshot
          cp README.md /tmp/proxy-scan-snapshot/README.md

          max_retries=5
          retry_count=0

          while [ $retry_count -lt $max_retries ]; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/proxy-scan-snapshot/README.md README.md
            git add README.md

            if git diff --cached --quiet; then
              echo "No changes to commit (remote already matches)"
              exit 0
            fi

            git commit -m "proxy scan: update private stats"

            if git push; then
              echo "Successfully pushed proxy scan stats"
              exit 0
            fi

            retry_count=$((retry_count + 1))
            if [ $retry_count -lt $max_retries ]; then
              echo "Push failed (remote moved), retrying in 10 seconds... (Attempt $retry_count/$max_retries)"
              sleep 10
            fi
          done

          echo "Failed to push proxy scan stats after $max_retries attempts"
          exit 1

      - name: Send Telegram Notification on Failure (proxy-scan)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.ADMIN_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            -d "text=❌ <b>خطا در اجرا (proxy-scan)!</b>%0A%0A📌 <b>ریپازیتوری:</b> ${{ github.repository }}%0A🔗 <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>مشاهده لوگ‌های خطا در گیتهاب</a>"

  converter:
    needs: [update-configs, proxy-scan]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.run_converter) &&
      vars.RUN_CONVERTER != 'false' &&
      (needs.update-configs.result == 'success' || needs.update-configs.result == 'skipped') &&
      (needs.proxy-scan.result == 'success' || needs.proxy-scan.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json found — skipping npm ci"
          fi

      - name: Run builder
        run: node index.js
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: ${{ vars.PUBLIC_REPO }}

      - name: Commit and push cache/state (not outputs — those are pushed to PUBLIC_REPO by index.js)
        run: |
          set -e
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if [ ! -d .state ] || [ -z "$(ls -A .state 2>/dev/null)" ]; then
            echo "No .state/ output to commit"
            exit 0
          fi

          # .state/* (geo cache, output history) is fully rewritten by
          # index.js each run, not hand-edited, so — same as every other
          # commit/push step in this workflow — there's nothing worth a
          # textual 3-way merge. Snapshot it and, on every attempt, reset
          # hard to whatever is currently on origin/main before dropping our
          # copy back on top. This replaces stefanzweifel/git-auto-commit-action,
          # which committed then did a single unguarded push with no retry:
          # the moment another commit landed on main in between (this run
          # showed remote 1 commit ahead by the time this step ran), it
          # failed outright with "non-fast-forward" and no way to recover.
          # If this keeps happening often, it's worth checking whether
          # something else (another workflow, a manual push, or an
          # overlapping trigger not covered by the `concurrency:` group
          # above) is also committing to this repo's main branch.
          mkdir -p /tmp/converter-snapshot
          tar -cf /tmp/converter-snapshot/state.tar .state

          max_retries=5
          retry_count=0

          while [ $retry_count -lt $max_retries ]; do
            git fetch origin main
            git reset --hard origin/main
            tar -xf /tmp/converter-snapshot/state.tar
            git add .state/

            if git diff --cached --quiet; then
              echo "No changes to commit (remote already matches)"
              exit 0
            fi

            git commit -m "Update geo cache & history"

            if git push; then
              echo "Successfully pushed cache/state"
              exit 0
            fi

            retry_count=$((retry_count + 1))
            if [ $retry_count -lt $max_retries ]; then
              echo "Push failed (remote moved), retrying in 15 seconds... (Attempt $retry_count/$max_retries)"
              sleep 15
            fi
          done

          echo "Failed to push cache/state after $max_retries attempts"
          exit 1

      - name: Send Telegram Notification on Failure (converter)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.ADMIN_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            -d "text=❌ <b>خطا در اجرا (converter)!</b>%0A%0A📌 <b>ریپازیتوری:</b> ${{ github.repository }}%0A🔗 <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>مشاهده لوگ‌های خطا در گیتهاب</a>"
